name: build

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Pack module zip
        run: |
          set -euo pipefail
          # Copy the module tree without .git and without the .github/ dir this
          # workflow lives in (upstream ships no .github/, so it must not be
          # packed into the module zip).
          mkdir -p "$RUNNER_TEMP/modsrc" "$RUNNER_TEMP/helper" dist
          tar --exclude=./.git --exclude=./.github --exclude=./dist -cf - . | tar -xf - -C "$RUNNER_TEMP/modsrc"
          cat > "$RUNNER_TEMP/helper/main.go" <<'EOF'
          package main

          import (
          	"log"
          	"os"

          	"golang.org/x/mod/module"
          	"golang.org/x/mod/zip"
          )

          func main() {
          	m := module.Version{Path: os.Args[1], Version: os.Args[2]}
          	f, err := os.Create(os.Args[4])
          	if err != nil {
          		log.Fatal(err)
          	}
          	defer f.Close()
          	if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
          		log.Fatal(err)
          	}
          	log.Printf("created module zip: %s", os.Args[4])
          }
          EOF
          cd "$RUNNER_TEMP/helper"
          go mod init example.com/helper
          go get golang.org/x/mod@v0.14.0
          go run . github.com/Masterminds/goutils v1.1.0 "$RUNNER_TEMP/modsrc" "$GITHUB_WORKSPACE/dist/v1.1.0.zip"
          unzip -l "$GITHUB_WORKSPACE/dist/v1.1.0.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: dist/v1.1.0.zip
